<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人员名单 - 云家官网</title>
<link rel="icon" type="image/jpeg" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEaHVRqkr3tjBORH2kGykGqD-gueDmPawACVyQAAmiKmVRNK96kIai3aj0E.jpeg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f3f7f4; color: #2f3a36; padding: 32px 16px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; color: #2e7d52; text-align: center; margin-bottom: 24px; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input, .toolbar select, .toolbar button {
    padding: 9px 12px; border: 1px solid #cfe3d8; border-radius: 8px;
    font-size: 14px; background: #fff;
  }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar button { background: #2e7d52; color: #fff; border: none; cursor: pointer; }
  .toolbar button:hover { background: #256b45; }
  .count { font-size: 13px; color: #6b7d75; margin-bottom: 8px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px;
    overflow: hidden; box-shadow: 0 4px 18px rgba(46,125,82,.08); }
  th, td { padding: 13px 16px; text-align: left; font-size: 14px; border-bottom: 1px solid #eef3f0; }
  th { background: #eaf5ee; color: #2e7d52; cursor: pointer; user-select: none; }
  th:hover { background: #dcefe3; }
  tr:hover td { background: #f7fbf8; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px;
    background: #eaf5ee; color: #2e7d52; font-size: 12px; }

  .contact-btn { color: #2e7d52; text-decoration: none; font-size: 13px;
    border: 1px solid #9ed3b4; padding: 5px 12px; border-radius: 999px;
    cursor: pointer; background: #fff; transition: .15s; }
  .contact-btn:hover { background: #2e7d52; color: #fff; border-color: #2e7d52; }

  tr.muted td, tr.muted td .contact-btn { color: #9aa6a1; }
  tr.muted td .contact-btn { border-color: #cfd8d4; }
  tr.muted td .contact-btn:hover { background: #cfd8d4; color: #fff; border-color: #cfd8d4; }

  .footer { text-align: center; margin-top: 28px; font-size: 13px; color: #7c8a84; }
  .footer a.home { display: inline-block; margin-bottom: 8px; color: #2e7d52;
    text-decoration: none; border: 1px solid #9ed3b4; padding: 7px 18px;
    border-radius: 999px; font-weight: 500; }
  .footer a.home:hover { background: #2e7d52; color: #fff; border-color: #2e7d52; }

  .tip { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: #2f3a36; color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99; }
  .tip.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>人员名单</h1>

  <div class="toolbar">
    <input id="search" placeholder="搜索人员、QQ或区域…">
    <select id="regionFilter"><option value="">全部区域</option></select>
    <button onclick="resetFilters()">重置</button>
  </div>
  <div class="count" id="count"></div>

  <table>
    <thead>
      <tr>
        <th onclick="sortBy('name')">人员</th>
        <th onclick="sortBy('qq')">QQ</th>
        <th onclick="sortBy('region')">区域</th>
        <th>立即联系</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="footer">
    <a class="home" href="https://wwyuanyu.github.io/yunjianb/" target="_blank" rel="noopener">进入官网</a>
    <div>© 云家官网所有</div>
  </div>
</div>

<div class="tip" id="tip"></div>

<script>
/* ===== 设备判断 + QQ 跳转（手机拉起资料卡主页 / 电脑走网页） ===== */
function isMobile() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}
function openQQ(qq, web) {
  if (isMobile()) {
    window.location.href = `mqqapi://card/show_pslcard?src_type=web&version=1&uin=${qq}`;
  } else {
    if (web) {
      window.open(web, "_blank", "noopener");
    } else {
      copyText(qq);
      showTip(`已复制 QQ 号 ${qq}，请粘贴搜索添加`);
    }
  }
}
function copyText(text) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}
let tipTimer = null;
function showTip(msg) {
  const t = document.getElementById("tip");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ===== 数据（区域统一为「未知」） ===== */
const agents = [
  { name: "澜",   qq: "1707879407", region: "未知", link: "https://qm.qq.com/q/PSpBu3Nn20" },
  { name: "xxxx", qq: "123456",    region: "未知", link: "" },
  { name: "xxxx", qq: "123456",    region: "未知", link: "" },
  { name: "xxxx", qq: "123456",    region: "未知", link: "" },
  { name: "xxxx", qq: "123456",    region: "未知", link: "" },
  { name: "xxxx", qq: "123456",    region: "未知", link: "" }
];

let sortKey = "", sortAsc = true;

function render(list) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = list.map((a, i) => {
    const muted = i === 0 ? "" : "muted";
    const btn = a.qq
      ? `<button class="contact-btn" onclick="openQQ('${a.qq}','${a.link || ''}')">立即联系</button>`
      : '<span style="color:#cfd8d4">—</span>';
    return `<tr class="${muted}">
      <td>${a.name}</td><td>${a.qq}</td>
      <td><span class="tag">${a.region}</span></td>
      <td>${btn}</td></tr>`;
  }).join("");
  document.getElementById("count").textContent = `共 ${list.length} 条记录`;
}

function sortBy(key) {
  if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
  render([...agents].sort((x, y) => String(x[key]).localeCompare(String(y[key]), "zh") * (sortAsc ? 1 : -1)));
}
function resetFilters() {
  document.getElementById("search").value = "";
  document.getElementById("regionFilter").value = "";
  render(agents);
}

const regions = [...new Set(agents.map(a => a.region).filter(Boolean))].sort();
regions.forEach(r => {
  const o = document.createElement("option"); o.value = r; o.textContent = r;
  document.getElementById("regionFilter").appendChild(o);
});
document.getElementById("search").addEventListener("input", e => {
  const v = e.target.value.trim().toLowerCase();
  render(agents.filter(a => a.name.toLowerCase().includes(v) || a.qq.toLowerCase().includes(v) || a.region.toLowerCase().includes(v)));
});
document.getElementById("regionFilter").addEventListener("change", e => {
  render(e.target.value ? agents.filter(a => a.region === e.target.value) : agents);
});

render(agents);
</script>
</body>
</html>
